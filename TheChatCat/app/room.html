<!DOCTYPE html>

<html lang="es">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>TheChatCat - Room</title>
        <script src="js/verified.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="js/supabase.js"></script>

        <link rel="stylesheet" href="../css/style.css">
        <link rel="stylesheet" href="../css/app.css">

        <style>
            .room-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 4px;
            }

            .room-row > a:first-child {
                flex: 1;
            }

            .room-settings-button {
                margin-left: 6px;
                padding: 2px 5px;
                text-decoration: none;
                font-size: 14px;
            }

            .room-settings-button:hover {
                text-decoration: none;
            }

            .room-info-button {
                display: inline-block;

                margin-top: 8px;
                padding: 5px 9px;

                border: 1px solid #aaa;
                border-radius: 3px;

                background: linear-gradient(
                    to bottom,
                    #ffffff,
                    #e4e4e4
                );

                color: #444;

                font-size: 12px;
                font-weight: bold;

                text-decoration: none;
            }

            .room-info-button:hover {
                background: linear-gradient(
                    to bottom,
                    #ffffff,
                    #eeeeee
                );
            }

            .room-container {
                max-width: 1000px;
                margin: 0 auto;
            }

            .room-title {
                margin-bottom: 15px;
            }

            .room-title h1 {
                margin-bottom: 5px;
            }

            .room-title p {
                color: #777;
            }

            .chat-box {
                background: white;
                border: 1px solid #aaa;
                min-height: 450px;
                max-height: 60vh;
                overflow-y: auto;
                padding: 15px;
            }

            .message {
                padding: 8px 5px;
                border-bottom: 1px solid #eee;
            }

            .message:last-child {
                border-bottom: none;
            }

            .message-user {
                font-weight: bold;
                color: #2874b8;
            }

            .message-time {
                color: #999;
                font-size: 11px;
                margin-left: 6px;
            }

            .message-content {
                margin-top: 3px;
                word-wrap: break-word;
            }

            .message-form {
                display: flex;
                margin-top: 10px;
            }

            .message-form input {
                flex: 1;
                padding: 10px;
                border: 1px solid #aaa;
                border-radius: 3px 0 0 3px;
                box-sizing: border-box;
            }

            .message-form button {
                padding: 10px 18px;
                border: 1px solid #1d5fa7;
                background: linear-gradient(#6eb5f7, #2878c8);
                color: white;
                font-weight: bold;
                cursor: pointer;
                border-radius: 0 3px 3px 0;
            }

            .message-form button:hover {
                background: linear-gradient(#82c1fa, #3688d5);
            }

            .message-form button:disabled {
                opacity: 0.6;
                cursor: wait;
            }

            #status {
                margin-top: 8px;
                color: #777;
                font-size: 12px;
            }

        </style>

    </head>


    <body>

        <header>

            <div class="logo">
                TheChatCat
            </div>

            <nav>
                <a href="index.html">Home</a>
                <a href="profile.html">Profile</a>
                <a href="settings.html">Settings</a>
                <a href="../index.html">Exit</a>
            </nav>

        </header>


        <main class="app-container">



        <aside class="sidebar">

            <h3>Rooms</h3>

            <div id="rooms-list">
                <p>Loading rooms...</p>
            </div>

            <a href="create-room.html" class="button" style="color: white;">
                Create Room
            </a>

            <a href="room-directory.html" class="button" style="color: white;">
                Room Directory
            </a>

            <h3>Private</h3>

            <a href="messages.html">
                Messages
            </a>

        </aside>






            <section class="welcome">

                <div class="room-container">

                    <div class="room-title">

                        <h1 id="room-name">
                            Loading room...
                        </h1>

                        <p id="room-description">
                            Loading...
                        </p>

                        <a
                            id="room-info-button"
                            class="room-info-button"
                            href="#"
                        >
                            Room Info
                        </a>

                    </div>

                    <div class="chat-box" id="chat-box">

                        <p>
                            Loading messages...
                        </p>

                    </div>


                    <form class="message-form" id="message-form">

                        <input
                            type="text"
                            id="message-input"
                            placeholder="Write a message..."
                            maxlength="2000"
                            autocomplete="off"
                            required
                        >

                        <button
                            type="submit"
                            id="send-button"
                        >
                            Send
                        </button>

                    </form>


                    <div id="status">
                        Connecting...
                    </div>

                </div>

            </section>

        </main>


        <footer>

            <p>
                © 2012-2026 TheChatCat
            </p>

        </footer>


        <script>

            async function loadRooms() {
                const roomsList = document.getElementById("rooms-list");

                if (!roomsList) {
                    console.error("ROOMS LIST NOT FOUND");
                    return;
                }

                const {
                    data: { session },
                    error: sessionError
                } = await supabaseClient.auth.getSession();

                if (sessionError || !session) {
                    console.error("SESSION ERROR:", sessionError);
                    roomsList.innerHTML = "<p>Please log in.</p>";
                    return;
                }

                const { data: rooms, error } = await supabaseClient
                    .from("rooms")
                    .select(`
                        id,
                        name,
                        slug,
                        description,
                        is_private,
                        owner_id,
                        created_at
                    `)
                    .or(
                        `is_private.eq.false,owner_id.eq.${session.user.id}`
                    )
                    .order("created_at", {
                        ascending: true
                    });

                if (error) {
                    console.error("ROOM LOAD ERROR:", error);
                    roomsList.innerHTML =
                        "<p>Could not load rooms.</p>";
                    return;
                }

                roomsList.innerHTML = "";

                if (!rooms || rooms.length === 0) {
                    roomsList.innerHTML =
                        "<p>No rooms available.</p>";
                    return;
                }


                rooms.forEach(room => {
                    const roomRow = document.createElement("div");
                    roomRow.className = "room-row";

                    const link = document.createElement("a");

                    link.href =
                        `room.html?room=${encodeURIComponent(room.id)}`;

                    link.textContent = room.name;

                    link.title =
                        room.description || room.name;

                    roomRow.appendChild(link);

                    // Mostrar Settings solamente al dueño
                    if (room.owner_id === session.user.id) {
                        const settingsButton = document.createElement("a");

                        settingsButton.href =
                            `room-settings.html?room=${encodeURIComponent(room.id)}`;

                        settingsButton.className = "room-settings-button";
                        settingsButton.textContent = "⚙";
                        settingsButton.title = "Room Settings";

                        roomRow.appendChild(settingsButton);
                    }

                    roomsList.appendChild(roomRow);
                });


            }

            loadRooms();



            
        </script>

        <script>

                    let currentUser = null;
                    let currentRoom = null;
                    let realtimeChannel = null;



                    async function initRoom() {

                        // Comprobar sesión

                        const {
                            data: { session }
                        } = await supabaseClient.auth.getSession();


                        if (!session) {

                            window.location.href = "login.html";

                            return;
                        }


                        currentUser = session.user;


                        // Obtener sala desde la URL

                        const params = new URLSearchParams(
                            window.location.search
                        );

                        currentRoom = params.get("room");
                        
                        if (!currentRoom) {
            window.location.href = "index.html";
            return;
        }

        const { data: room, error: roomError } =
            await supabaseClient
                .from("rooms")
                .select(`
                    id,
                    name,
                    description,
                    is_private
                `)
                .eq("id", currentRoom)
                .single();

                if (roomError || !room) {
                    console.error("ROOM ERROR:", roomError);

                    document.getElementById("room-name").textContent =
                        "Room not found";

                    document.getElementById("room-description").textContent =
                        "This room does not exist.";

                    return;
                }

                document.getElementById("room-name").textContent =
                    room.name;

                document.getElementById("room-description").textContent =
                    room.description || "";

                await loadMessages();

                subscribeToMessages();

                document.getElementById("status").textContent =
                    "Connected.";


                        // Sala inexistente

                        if (!rooms[currentRoom]) {

                            window.location.href =
                                "room.html?room=global";

                            return;
                        }


                        // Mostrar información

                        document.getElementById("room-name").textContent =
                            rooms[currentRoom].name;

                        document.getElementById("room-description").textContent =
                            rooms[currentRoom].description;


                        // Cargar mensajes

                        await loadMessages();


                        // Activar Realtime

                        subscribeToMessages();


                        document.getElementById("status").textContent =
                            "Connected.";
                    }




                    async function loadMessages() {

                        const chatBox =
                            document.getElementById("chat-box");


                        // Obtener mensajes

                        const { data: messages, error: messagesError } =
                            await supabaseClient

                            .from("messages")

                            .select(`
                                id,
                                room_id,
                                user_id,
                                content,
                                created_at
                            `)

                            .eq("room_id", currentRoom)

                            .gte(
                                "created_at",
                                new Date(
                                    Date.now() - 24 * 60 * 60 * 1000
                                ).toISOString()
                            )

                            .order("created_at", {
                                ascending: true
                            });


                        if (messagesError) {

                            console.error(
                                "MESSAGE LOAD ERROR:",
                                messagesError
                            );

                            chatBox.innerHTML =
                                "<p>Could not load messages.</p>";

                            return;
                        }


                        chatBox.innerHTML = "";


                        if (!messages || messages.length === 0) {

                            chatBox.innerHTML =
                                "<p>No messages yet. Be the first!</p>";

                            return;
                        }


                        // Obtener IDs únicos de los usuarios

                        const userIds = [
                            ...new Set(
                                messages.map(
                                    message => message.user_id
                                )
                            )
                        ];


                        // Obtener perfiles

                        const { data: profiles, error: profilesError } =
                            await supabaseClient

                            .from("profiles")

                            .select(`
                                id,
                                username,
                                display_name
                            `)

                            .in("id", userIds);


                        if (profilesError) {

                            console.error(
                                "PROFILE LOAD ERROR:",
                                profilesError
                            );

                            chatBox.innerHTML =
                                "<p>Could not load user profiles.</p>";

                            return;
                        }


                        // Convertir perfiles en un mapa

                        const profileMap = new Map();


                        profiles.forEach(profile => {

                            profileMap.set(
                                profile.id,
                                profile
                            );

                        });


                        // Mostrar mensajes

                        messages.forEach(message => {

                            message.profiles =
                                profileMap.get(
                                    message.user_id
                                ) || null;


                            renderMessage(message);

                        });


                        scrollToBottom();
                    }


                    function renderMessage(message) {

                        const chatBox =
                            document.getElementById("chat-box");


                        const messageElement =
                            document.createElement("div");

                        messageElement.className = "message";



                        const username =
                            message.profiles?.display_name ||
                            message.profiles?.username ||
                            "Unknown user";

                        const usernameLink =
                            document.createElement("a");

                        usernameLink.className =
                            "message-username";

                        usernameLink.href =
                            `profile.html?id=${encodeURIComponent(message.user_id)}`;

                        usernameLink.textContent =
                            username;




                        const date =
                            new Date(message.created_at);


                        const time =
                            date.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            });


                        const userElement =
                            document.createElement("span");

                        userElement.className =
                            "message-user";

                        userElement.textContent =
                            username;


                        const timeElement =
                            document.createElement("span");

                        timeElement.className =
                            "message-time";

                        timeElement.textContent =
                            time;


                        const contentElement =
                            document.createElement("div");

                        contentElement.className =
                            "message-content";

                        // textContent evita interpretar HTML enviado por usuarios

                        contentElement.textContent =
                            message.content;


                        messageElement.appendChild(
                            usernameLink
                        );

                        messageElement.appendChild(
                            timeElement
                        );

                        messageElement.appendChild(
                            contentElement
                        );

                        chatBox.appendChild(
                            messageElement
                        );
                    }



                    function subscribeToMessages() {

                        realtimeChannel =
                            supabaseClient

                            .channel(
                                "room-" + currentRoom
                            )

                            .on(
                                "postgres_changes",
                                {
                                    event: "INSERT",
                                    schema: "public",
                                    table: "messages",
                                    filter:
                                        "room_id=eq." + currentRoom
                                },

                                async (payload) => {

                                    const message =
                                        payload.new;


                                    // Buscar perfil del autor

                                    const { data } =
                                        await supabaseClient

                                        .from("profiles")

                                        .select(
                                            "username, display_name"
                                        )

                                        .eq(
                                            "id",
                                            message.user_id
                                        )

                                        .single();


                                    message.profiles =
                                        data;


                                    renderMessage(message);

                                    scrollToBottom();

                                }
                            )

                            .subscribe();
                    }



                    async function sendMessage(content) {

                        const { error } =
                            await supabaseClient

                            .from("messages")

                            .insert({

                                room_id: currentRoom,

                                user_id: currentUser.id,

                                content: content

                            });


                        if (error) {

                            console.error(error);

                            document.getElementById("status").textContent =
                                "Could not send message.";

                            return false;
                        }


                        return true;
                    }



                    function scrollToBottom() {

                        const chatBox =
                            document.getElementById("chat-box");


                        chatBox.scrollTop =
                            chatBox.scrollHeight;
                    }



                    document
                        .getElementById("message-form")
                        .addEventListener(
                            "submit",
                            async (event) => {

                                event.preventDefault();


                                const input =
                                    document.getElementById(
                                        "message-input"
                                    );

                                const button =
                                    document.getElementById(
                                        "send-button"
                                    );


                                const content =
                                    input.value.trim();


                                if (!content) {
                                    return;
                                }


                                button.disabled = true;


                                const success =
                                    await sendMessage(
                                        content
                                    );


                                if (success) {

                                    input.value = "";

                                    input.focus();

                                }


                                button.disabled = false;
                            }
                        );



                        async function loadSidebarRooms() {
                            const roomsList = document.getElementById("rooms-list");

                            if (!roomsList) {
                                console.error("SIDEBAR: #rooms-list not found");
                                return;
                            }

                            roomsList.innerHTML = "<p>Loading rooms...</p>";

                            const {
                                data: { session },
                                error: sessionError
                            } = await supabaseClient.auth.getSession();

                            if (sessionError || !session) {
                                console.error("SIDEBAR SESSION ERROR:", sessionError);
                                roomsList.innerHTML = "<p>Please log in.</p>";
                                return;
                            }

                            const { data: rooms, error } = await supabaseClient
                                .from("rooms")
                                .select("id, name, slug, is_private, owner_id, created_at")
                                .order("created_at", { ascending: true });

                            if (error) {
                                console.error("SIDEBAR ROOMS ERROR:", error);
                                roomsList.innerHTML = "<p>Unable to load rooms.</p>";
                                return;
                            }

                            if (!rooms || rooms.length === 0) {
                                roomsList.innerHTML = "<p>No rooms available.</p>";
                                return;
                            }

                            roomsList.innerHTML = rooms.map(room => `
                                <a
                                    href="room.html?room=${encodeURIComponent(room.id)}"
                                    class="room-sidebar-link"
                                >
                                    ${escapeHtml(room.name)}
                                </a>
                            `).join("");
                        }





                    
                async function init() {
                    await initRoom();
                    await loadSidebarRooms();

                }

                init();
        </script>

    </body>
</html>
