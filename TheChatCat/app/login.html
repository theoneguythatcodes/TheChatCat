<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TheChatCat - Login</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .auth-container {
            width: 420px;
            max-width: 90%;
            margin: 70px auto;
        }

        .auth-box {
            background: #f5f5f5;
            border: 1px solid #aaa;
            border-radius: 5px;
            padding: 25px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .auth-box h1 {
            margin-top: 0;
            color: #333;
            font-size: 26px;
        }

        .auth-box p {
            color: #555;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 3px;
            font-size: 14px;
        }

        .login-button {
            width: 100%;
            padding: 11px;
            border: 1px solid #1d5fa7;
            border-radius: 4px;
            background: linear-gradient(#6eb5f7, #2878c8);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: linear-gradient(#82c1fa, #3688d5);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #login-message {
            margin-top: 15px;
            font-weight: bold;
        }

        .signup-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Welcome back!</h1>

            <p>Log in to continue to TheChatCat.</p>

            <form id="login-form">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    Log in
                </button>

            </form>

            <p id="login-message"></p>

            <div class="signup-link">
                Don't have an account?
                <a href="signup.html">Create one</a>
            </div>

        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <script>
        const form = document.getElementById("login-form");
        const button = document.getElementById("login-button");
        const message = document.getElementById("login-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "";

            button.disabled = true;
            button.textContent = "Logging in...";

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = error.message;

                button.disabled = false;
                button.textContent = "Log in";

                return;
            }

            message.textContent = "Login successful!";

            // Entrar a la aplicación
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
