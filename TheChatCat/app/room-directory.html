<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Directory - TheChatCat</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #e9f2fb;
            color: #222;
        }

        header {
            background: linear-gradient(#4fa3e3, #1769aa);
            border-bottom: 1px solid #0b4775;
            box-shadow: 0 2px 5px rgba(0,0,0,.25);
            padding: 12px 20px;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 4px 0 0;
            font-size: 13px;
        }

        main {
            width: 90%;
            max-width: 900px;
            margin: 25px auto;
        }

        .box {
            background: white;
            border: 1px solid #a8bfd3;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,.15);
            padding: 18px;
            margin-bottom: 18px;
        }

        .box h2 {
            margin-top: 0;
            color: #1769aa;
            font-size: 20px;
        }

        #search {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #9bb6ca;
            border-radius: 3px;
            font-size: 14px;
            background: #f9fcff;
        }

        #search:focus {
            outline: none;
            border-color: #4b9bd1;
            box-shadow: 0 0 3px rgba(50,130,190,.35);
        }

        #rooms-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .room {
            border: 1px solid #b7c9d8;
            background: linear-gradient(#ffffff, #f3f7fa);
            border-radius: 4px;
            padding: 14px;
        }

        .room h3 {
            margin: 0 0 5px;
            color: #155f99;
            font-size: 18px;
        }

        .room-description {
            margin: 5px 0 10px;
            color: #444;
            font-size: 14px;
        }

        .room-address {
            color: #777;
            font-size: 12px;
            margin-bottom: 10px;
        }

        .button {
            display: inline-block;
            padding: 7px 12px;
            background: linear-gradient(#5aa9e6, #2478b8);
            border: 1px solid #145b8d;
            border-radius: 3px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 1px rgba(255,255,255,.35);
        }

        .button:hover {
            background: linear-gradient(#69b4ed, #2b83c4);
        }

        .status {
            color: #666;
            font-size: 14px;
        }

        .error {
            color: #a00;
            background: #fff0f0;
            border: 1px solid #d99;
            padding: 10px;
            border-radius: 3px;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 11px;
            margin: 30px 0;
        }

        @media (max-width: 600px) {
            main {
                width: 94%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>TheChatCat Room Directory</h1>
    <p>Browse public chat rooms.</p>
</header>

<main>
    <div class="box">
        <h2>My Rooms</h2>

        <div id="my-rooms-list">
            <p class="status">Loading your rooms...</p>
        </div>
    </div>

    <div class="box">
        <h2>Public Rooms</h2>

        <div id="public-rooms-list">
            <p class="status">Loading public rooms...</p>
        </div>
    </div>

</main>

<footer>
    © 2012-2026 TheChatCat Network
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
    const myRoomsList = document.getElementById("my-rooms-list");
    const publicRoomsList = document.getElementById("public-rooms-list");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function roomHtml(room) {
        return `
            <div class="room">

                <h3>
                    ${escapeHtml(room.name)}
                </h3>

                <div class="room-address">
                    Address: /${escapeHtml(room.slug)}
                </div>

                <p class="room-description">
                    ${escapeHtml(
                        room.description || "No description provided."
                    )}
                </p>

                <a
                    class="button"
                    href="room.html?room=${encodeURIComponent(room.id)}"
                >
                    Enter room
                </a>

            </div>
        `;
    }

    async function loadMyRooms(user) {

        myRoomsList.innerHTML = `
            <p class="status">Loading your rooms...</p>
        `;

        /*
         * First get all rooms the user has joined.
         */
        const {
            data: memberships,
            error: membershipError
        } = await supabaseClient
            .from("room_members")
            .select("room_id")
            .eq("user_id", user.id);

        if (membershipError) {
            console.error(
                "ROOM MEMBERS ERROR:",
                membershipError
            );

            myRoomsList.innerHTML = `
                <div class="error">
                    Could not load your rooms.
                    <br><br>
                    ${escapeHtml(membershipError.message)}
                </div>
            `;

            return;
        }

        const memberRoomIds =
            (memberships || []).map(
                membership => membership.room_id
            );

        /*
         * Get rooms owned by the user OR joined by the user.
         */
        let query = supabaseClient
            .from("rooms")
            .select(`
                id,
                name,
                slug,
                description,
                is_private,
                owner_id,
                created_at
            `);

        if (memberRoomIds.length > 0) {
            const ids = memberRoomIds.join(",");

            query = query.or(
                `owner_id.eq.${user.id},id.in.(${ids})`
            );
        } else {
            query = query.eq(
                "owner_id",
                user.id
            );
        }

        const {
            data: rooms,
            error: roomsError
        } = await query.order("created_at", {
            ascending: true
        });

        if (roomsError) {
            console.error(
                "MY ROOMS ERROR:",
                roomsError
            );

            myRoomsList.innerHTML = `
                <div class="error">
                    Could not load your rooms.
                    <br><br>
                    ${escapeHtml(roomsError.message)}
                </div>
            `;

            return;
        }

        if (!rooms || rooms.length === 0) {
            myRoomsList.innerHTML = `
                <p class="status">
                    You have not joined or created any rooms yet.
                </p>
            `;

            return;
        }

        myRoomsList.innerHTML =
            rooms.map(roomHtml).join("");
    }


    async function loadPublicRooms() {

        publicRoomsList.innerHTML = `
            <p class="status">Loading public rooms...</p>
        `;

        const {
            data: rooms,
            error
        } = await supabaseClient
            .from("rooms")
            .select(`
                id,
                name,
                slug,
                description,
                is_private,
                created_at
            `)
            .eq("is_private", false)
            .order("created_at", {
                ascending: true
            });

        if (error) {
            console.error(
                "PUBLIC ROOMS ERROR:",
                error
            );

            publicRoomsList.innerHTML = `
                <div class="error">
                    Could not load public rooms.
                    <br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            return;
        }

        if (!rooms || rooms.length === 0) {
            publicRoomsList.innerHTML = `
                <p class="status">
                    No public rooms found.
                </p>
            `;

            return;
        }

        publicRoomsList.innerHTML =
            rooms.map(roomHtml).join("");
    }


    async function initDirectory() {

        const {
            data,
            error
        } = await supabaseClient.auth.getSession();

        if (error) {
            console.error(
                "SESSION ERROR:",
                error
            );

            myRoomsList.innerHTML = `
                <div class="error">
                    Could not verify your session.
                </div>
            `;

            return;
        }

        const currentUser =
            data.session?.user || null;

        /*
         * My Rooms requires login.
         */
        if (currentUser) {
            await loadMyRooms(currentUser);
        } else {
            myRoomsList.innerHTML = `
                <p class="status">
                    Please log in to see your rooms.
                </p>
            `;
        }

        /*
         * Public rooms can still be displayed.
         */
        await loadPublicRooms();
    }

    initDirectory();
</script>




</body>
</html>
